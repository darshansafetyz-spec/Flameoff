<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <meta charset="UTF-8">

  <!-- Meta tags updated dynamically by JS -->
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="article">
  <meta property="og:image" content="">

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Loading… – Flame Off Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root,
    [data-theme="light"] {
      --r:    #ff2a00;
      --o:    #ff6a00;
      --y:    #ffb347;
      --bg:   #f5f3f0;
      --s1:   #ffffff;
      --s2:   #faf9f7;
      --card: #ffffff;
      --nav-bg: rgba(245,243,240,0.95);
      --bdr:  rgba(255,60,0,0.2);
      --bdr2: rgba(0,0,0,0.07);
      --txt:  #0f0f0f;
      --txt2: #1a1a1a;
      --dim:  rgba(0,0,0,0.5);
      --shadow: 0 2px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
      --grad: linear-gradient(90deg, var(--r), var(--o));
      --toggle-bg: #e8e4e0;
      --toggle-knob: #fff;
      --prose-bg: #ffffff;
      --code-bg: #f5f3f0;
      --grid-line: rgba(255,42,0,0.06);
    }
    [data-theme="dark"] {
      --bg:   #000000;
      --s1:   #080808;
      --s2:   #0e0e0e;
      --card: #121212;
      --nav-bg: rgba(0,0,0,0.92);
      --bdr:  rgba(255,60,0,0.18);
      --bdr2: rgba(255,60,0,0.18);
      --txt:  #ffffff;
      --txt2: #f0ece8;
      --dim:  rgba(255,255,255,0.45);
      --shadow: 0 2px 20px rgba(0,0,0,0.5);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
      --toggle-bg: #333;
      --toggle-knob: #ff6a00;
      --prose-bg: #0d0d0d;
      --code-bg: #1a1a1a;
      --grid-line: rgba(255,42,0,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--txt);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── NAV (identical) ── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 8000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 56px;
      background: var(--nav-bg); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bdr2);
      transition: background 0.4s, border-color 0.4s;
    }
    .logo { display: flex; align-items: center; height: 100%; text-decoration: none; }
    .logo img {
      width: 100%; max-width: 200px; height: auto; object-fit: contain;
      border-radius: 6px; border: 1px solid var(--bdr);
      filter: drop-shadow(0 0 8px rgba(255,60,0,0.4));
      transition: filter 0.3s, transform 0.3s;
    }
    .logo:hover img { filter: drop-shadow(0 0 16px rgba(255,60,0,0.7)); transform: scale(1.03); }
    .nav-center { display: flex; gap: 36px; list-style: none; }
    .nav-center a {
      color: var(--txt); text-decoration: none; font-weight: 500;
      position: relative; padding-bottom: 4px;
    }
    .nav-center a::before {
      content: ''; position: absolute; left: 0; bottom: -2px;
      width: 0%; height: 2px;
      background: linear-gradient(90deg, #ff2a00, #ff6a00);
      transition: width 0.3s ease; top: auto; opacity: 1; transform: none; border: none; z-index: 1;
    }
    .nav-center a:hover::before, .nav-center a.active::before { width: 100%; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .theme-toggle {
      display: flex; align-items: center; gap: 7px;
      background: var(--toggle-bg); border-radius: 30px; padding: 4px 10px;
      cursor: pointer; border: none; transition: background 0.4s, box-shadow 0.3s;
    }
    .theme-toggle:hover { box-shadow: 0 0 12px rgba(255,60,0,0.25); }
    .t-track { width: 36px; height: 20px; border-radius: 10px; background: var(--bdr2); position: relative; transition: background 0.3s; }
    [data-theme="dark"] .t-track { background: rgba(255,60,0,0.3); }
    .t-knob {
      position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
      background: var(--toggle-knob); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    [data-theme="dark"] .t-knob { transform: translateX(16px); }
    .t-icon { display: flex; align-items: center; }
    .t-icon svg { width: 15px; height: 15px; }
    [data-theme="light"] .t-icon-moon { opacity: .4; }
    [data-theme="dark"]  .t-icon-sun  { opacity: .4; }
    .nav-btn-fill {
      font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;
      padding: 9px 22px; border-radius: 4px; background: var(--grad); color: white; border: none;
      cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      box-shadow: 0 0 18px rgba(255,60,0,0.35); transition: box-shadow 0.3s, transform 0.2s;
      text-decoration: none; white-space: nowrap;
    }
    .nav-btn-fill:hover { box-shadow: 0 0 36px rgba(255,60,0,0.7); transform: translateY(-1px); }

    /* ── SCROLL PROGRESS ── */
    #prog {
      position: fixed; top: 0; left: 0; height: 3px; z-index: 9000;
      background: var(--grad); width: 0;
      box-shadow: 0 0 14px var(--r); transition: width 0.1s linear;
    }

    /* ── ARTICLE HERO ── */
    .article-hero {
      padding-top: 100px;
      background: var(--s1);
    }
    .article-hero__img {
      width: 100%; max-height: 520px; object-fit: cover;
      display: block;
    }
    .article-hero__img-skeleton {
      width: 100%; height: 420px;
      background: linear-gradient(90deg, var(--bdr2) 25%, rgba(255,60,0,0.04) 50%, var(--bdr2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .article-hero__meta-bar {
      max-width: 800px; margin: 0 auto; padding: 36px 24px 0;
    }
    .article-breadcrumb {
      font-size: 0.78rem; color: var(--dim); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .article-breadcrumb a { color: var(--r); text-decoration: none; }
    .article-breadcrumb a:hover { text-decoration: underline; }
    .article-category {
      display: inline-block;
      background: var(--grad); color: white;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 3px; margin-bottom: 18px;
    }
    .article-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      line-height: 1.05; letter-spacing: 1px; color: var(--txt);
      margin-bottom: 20px;
    }
    .article-info {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      font-size: 0.82rem; color: var(--dim);
      padding-bottom: 28px;
      border-bottom: 1px solid var(--bdr2);
    }
    .article-info-sep { opacity: 0.4; }

    /* ── ARTICLE CONTENT ── */
    .article-layout {
      max-width: 800px; margin: 0 auto; padding: 48px 24px 100px;
    }
    .article-prose {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.08rem; line-height: 1.85;
      color: var(--txt2);
    }
    /* Typography for HTML content from CMS */
    .article-prose h1, .article-prose h2, .article-prose h3, .article-prose h4 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      letter-spacing: 1px; color: var(--txt); line-height: 1.1;
      margin: 2em 0 0.7em;
    }
    .article-prose h3 { font-size: clamp(1.2rem, 2.5vw, 1.8rem); }
    .article-prose h4 { font-size: 1.1rem; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
    .article-prose p { margin-bottom: 1.5em; }
    .article-prose a { color: var(--r); text-decoration: underline; text-decoration-thickness: 1px; }
    .article-prose a:hover { color: var(--o); }
    .article-prose ul, .article-prose ol { padding-left: 1.6em; margin-bottom: 1.5em; }
    .article-prose li { margin-bottom: 0.5em; }
    .article-prose blockquote {
      border-left: 3px solid var(--r); padding: 12px 24px;
      margin: 2em 0; background: rgba(255,60,0,0.04); border-radius: 0 8px 8px 0;
      font-style: italic; color: var(--dim);
    }
    .article-prose img {
      width: 100%; border-radius: 8px; margin: 2em 0;
      box-shadow: var(--shadow-lg);
    }
    .article-prose pre, .article-prose code {
      background: var(--code-bg); border-radius: 6px; font-family: 'Courier New', monospace;
      font-size: 0.88em;
    }
    .article-prose pre { padding: 20px; overflow-x: auto; margin: 1.5em 0; }
    .article-prose code { padding: 2px 6px; }
    .article-prose hr {
      border: none; border-top: 1px solid var(--bdr2); margin: 3em 0;
    }
    .article-prose table { width: 100%; border-collapse: collapse; margin: 2em 0; font-size: 0.92rem; }
    .article-prose th, .article-prose td { border: 1px solid var(--bdr2); padding: 10px 14px; text-align: left; }
    .article-prose th { background: rgba(255,60,0,0.06); font-family: 'Oswald', sans-serif; letter-spacing: 1px; }

    /* Loading state for article */
    .prose-skeleton { display: flex; flex-direction: column; gap: 14px; }
    .skel-line {
      height: 14px; border-radius: 4px;
      background: linear-gradient(90deg, var(--bdr2) 25%, rgba(255,60,0,0.04) 50%, var(--bdr2) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite;
    }
    .skel-line--lg { height: 36px; width: 80%; }
    .skel-line--md { width: 60%; }
    .skel-line--sm { width: 40%; }

    /* ── SHARE / BACK ── */
    .article-footer-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 16px; padding-top: 40px; border-top: 1px solid var(--bdr2); margin-top: 48px;
    }
    .btn-back {
      font-family: 'Oswald', sans-serif; font-size: 0.76rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--r); text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      transition: gap 0.2s;
    }
    .btn-back:hover { gap: 12px; }
    .share-bar { display: flex; align-items: center; gap: 12px; }
    .share-label { font-size: 0.78rem; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
    .share-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--bdr2); background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--txt); text-decoration: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .share-btn:hover { border-color: var(--r); color: var(--r); background: rgba(255,60,0,0.06); }
    .share-btn svg { width: 16px; height: 16px; }

    /* ── ERROR / NOT FOUND ── */
    .article-not-found {
      max-width: 600px; margin: 200px auto 100px; text-align: center; padding: 0 24px;
    }
    .article-not-found h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--r); margin-bottom: 16px;
    }
    .article-not-found p { color: var(--dim); margin-bottom: 28px; line-height: 1.7; }

    /* ── RESPONSIVE ── */
 @media (max-width: 768px) {
      #nav { padding: 14px 20px; }
      .nav-center { display: none; }
      .nav-btn-fill { padding: 8px 14px; font-size: 0.7rem; }
      .article-hero { padding-top: 72px; }
      .article-hero__img { max-height: 340px; }
      .article-hero__meta-bar { padding: 24px 20px 0; }
      .article-title { font-size: clamp(2rem, 8vw, 3rem); }
      .article-layout { padding: 32px 20px 72px; }
      .article-prose { font-size: 1rem; line-height: 1.8; }
      .article-footer-bar { flex-direction: column; align-items: flex-start; gap: 20px; }
    }
    @media (max-width: 480px) {
      #nav { padding: 12px 16px; }
      .nav-btn-fill { padding: 7px 12px; font-size: 0.66rem; letter-spacing: 1px; }
      .article-hero__img { max-height: 240px; }
      .article-hero__meta-bar { padding: 20px 16px 0; }
      .article-title { font-size: clamp(1.8rem, 9vw, 2.4rem); }
      .article-layout { padding: 28px 16px 60px; }
      .article-info { gap: 10px; font-size: 0.78rem; }
      .article-prose { font-size: 0.96rem; }
      .article-prose h2 { font-size: clamp(1.4rem, 6vw, 1.9rem); }
      .article-prose h3 { font-size: clamp(1.1rem, 5vw, 1.5rem); }
      .share-bar { flex-wrap: wrap; gap: 8px; }
    }
  </style>
</head>

<!-- ── SCRIPTS ── -->
<script src="js/blog-config.js"></script>
<script src="js/blog-ui.js"></script>
<script>
  /* ── Theme init ── */
  const LOGO_LIGHT = 'https://darshansafety.in/wp-content/uploads/2026/04/facebook-ADS-6.avif';
  const LOGO_DARK  = 'https://darshansafety.in/wp-content/uploads/2026/04/facebook-ADS-5.avif';

  function updateLogos(theme) {
    const src = theme === 'dark' ? LOGO_DARK : LOGO_LIGHT;
    document.querySelectorAll('#logo-nav').forEach(img => img.src = src);
  }
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('fo-theme', newTheme);
    updateLogos(newTheme);
  }
  (function() {
    const saved = localStorage.getItem('fo-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    updateLogos(saved);
  })();

  /* ── Scroll progress ── */
  const pb = document.getElementById('prog');
  window.addEventListener('scroll', () => {
    const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
    pb.style.width = pct + '%';
  }, { passive: true });

  /* ── Load blog by slug ── */
  async function loadArticle() {
    const slug = new URLSearchParams(window.location.search).get('slug');

    if (!slug) {
      renderNotFound('No article specified.');
      return;
    }

    try {
      const blogs = await fetchBlogs({ slug });
      if (!blogs || !blogs.length) {
        renderNotFound('Article not found.');
        return;
      }
      renderArticle(blogs[0]);
    } catch (err) {
      console.error('[BlogDetails] Error:', err);
      renderNotFound('Failed to load article. Please try again.');
    }
  }

  function renderArticle(blog) {
    const imageUrl = getBlogImageUrl(blog.featured_image);
    const date = formatDate(blog.created_at);
    const timeToRead = readingTime(blog.content);

    // Dynamic SEO
    const pageTitle = blog.meta_title || blog.title;
    setPageMeta(
      `${pageTitle} – Flame Off Blog`,
      blog.meta_description || ''
    );
    // OG Image
    if (imageUrl) {
      let ogImg = document.querySelector('meta[property="og:image"]');
      if (!ogImg) { ogImg = document.createElement('meta'); ogImg.setAttribute('property', 'og:image'); document.head.appendChild(ogImg); }
      ogImg.setAttribute('content', imageUrl);
    }

    const root = document.getElementById('article-root');
    root.innerHTML = `
      <article>
        <header class="article-hero">
          ${imageUrl
            ? `<img src="${imageUrl}" alt="${blog.title}" class="article-hero__img" loading="eager">`
            : ''}
          <div class="article-hero__meta-bar">
            <nav class="article-breadcrumb" aria-label="Breadcrumb">
              <a href="index.html">Home</a>
              <span aria-hidden="true">›</span>
              <a href="blog.html">Blog</a>
              <span aria-hidden="true">›</span>
              <span>${blog.title}</span>
            </nav>
            ${blog.category ? `<span class="article-category">${blog.category}</span>` : ''}
            <h1 class="article-title">${blog.title}</h1>
            <div class="article-info">
              <span>${date}</span>
              <span class="article-info-sep" aria-hidden="true">·</span>
              <span>${timeToRead}</span>
              ${blog.author ? `<span class="article-info-sep" aria-hidden="true">·</span><span>By ${blog.author}</span>` : ''}
            </div>
          </div>
        </header>

        <div class="article-layout">
          <div class="article-prose" id="article-prose">
            ${blog.content || ''}
          </div>

          <footer class="article-footer-bar">
            <a href="/blog.html" class="btn-back" aria-label="Back to all articles">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M13 7H1M6 2L1 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              All Articles
            </a>
            <div class="share-bar">
              <span class="share-label">Share</span>
              <a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(blog.title)}" target="_blank" rel="noopener noreferrer" class="share-btn" aria-label="Share on Twitter/X">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              </a>
              <a href="https://wa.me/?text=${encodeURIComponent(blog.title + ' ' + window.location.href)}" target="_blank" rel="noopener noreferrer" class="share-btn" aria-label="Share on WhatsApp">

  }

  function renderNotFound(msg) {
    document.title = 'Not Found – Flame Off Blog';
    document.getElementById('article-root').innerHTML = `
      <div class="article-not-found">
        <h2>404</h2>
        <p>${msg}</p>
        <a href="blog.html" class="nav-btn-fill" style="display:inline-flex;">← Back to Blog</a>
      </div>
    `;
  }

  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      // Brief visual feedback
      const btn = event.currentTarget;
      btn.style.borderColor = '#16a34a';
      setTimeout(() => btn.style.borderColor = '', 1500);
    });
  }

  loadArticle();
</script>
